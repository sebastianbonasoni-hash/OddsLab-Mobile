name: Mobile beta checks
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/**'
      - '.github/workflows/beta-check.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate published data and safe beta labels
        run: python tests/check_beta.py
